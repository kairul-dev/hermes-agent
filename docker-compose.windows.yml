#
# docker-compose.windows.yml — Windows Docker Desktop compatible
#
# Differences from docker-compose.yml:
#   - Removes `network_mode: host` (not supported on Docker Desktop for Windows)
#   - Uses explicit port mappings instead
#   - Uses Windows-style volume path for ~/.hermes
#
# Usage:
#   First configure authentication in the mounted ${USERPROFILE}/.hermes:
#   config.yaml: dashboard.basic_auth.username (for example, admin)
#   .env: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD and
#         HERMES_DASHBOARD_BASIC_AUTH_SECRET (a strong random signing secret).
#   Alternatively configure a supported OAuth/OIDC provider.
#   See website/docs/user-guide/docker.md for authentication setup.
#   docker compose -f docker-compose.windows.yml up -d
#   Container bind 0.0.0.0 requires authentication even though the published
#   port is restricted to host loopback. --insecure does not bypass that gate.
#
services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
    command: ["gateway", "run"]

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_DASHBOARD_HOST=0.0.0.0
    ports:
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
